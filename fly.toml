# DEMO/STAGING apenas — ver docs/DEMO_DEPLOY.md. Não declara nem substitui uma decisão de infraestrutura
# de produção (H11, docs/PRODUCTION_GATE.md, PG-22, continua aberto). Troque "app" pelo nome real da sua
# aplicação Fly antes do primeiro deploy (`fly apps create <nome>` ou `fly launch --no-deploy`).
app = "patrono-legal-demo"
primary_region = "gru"

[build]

[env]
  PORT = "3007"
  # NODE_ENV é definido via `fly secrets set` (nunca aqui, para nunca acidentalmente versionar um valor
  # de produção) — ver docs/DEMO_DEPLOY.md.

[http_service]
  internal_port = 3007
  force_https = true
  # P0 (branch demo): o Fly autostop derrubou a máquina no meio de uma sincronização real via SSH
  # ("App has excess capacity, autostopping machine" -> SIGINT), porque autostop mede tráfego HTTP, não
  # sessões SSH/scripts em execução. Para o período de sincronização/apresentação, mantemos sempre pelo
  # menos 1 máquina ativa e desligamos o autostop — custo maior que o "dorme entre acessos" original
  # (seção 7 de docs/DEMO_DEPLOY.md), aceito deliberadamente só para este ambiente temporário. Reverter
  # para auto_stop_machines = "stop" / min_machines_running = 0 depois da apresentação, se quiser
  # economizar custo (ver seção 8, "Encerrar o ambiente depois do Comitê").
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Roda a migration de schema (idempotente, scripts/migrate.js) a cada deploy — nunca a migração de dados
# (scripts/migrate-h1b-data.js), que é um cutover único e deliberado, feito manualmente uma vez (ver
# docs/DEMO_DEPLOY.md).
[deploy]
  release_command = "node scripts/migrate.js"
