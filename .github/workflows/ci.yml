name: CI

# Pipeline mínimo, coerente com o que o projeto realmente usa hoje — sem inventar ferramentas
# (lint/typecheck) que não existem no package.json. Roda em todo Pull Request e push para as branches
# principais, para que "os testes passam" nunca dependa apenas da afirmação local de quem abriu o PR.
on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  test:
    name: npm test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    # Sprint 2, Hardening H1A/H1B (docs/PRODUCTION_GATE.md): serviço de PostgreSQL isolado só para esta
    # execução de CI — nunca aponta para nenhum banco real/produção. TEST_DATABASE_URL habilita os
    # testes de tests/storage.test.js, tests/security-integration-postgres.test.js e
    # tests/h1b-core-relational.test.js que exercitam o backend Postgres de verdade (concorrência real,
    # transação, healthcheck, FK/CAS por linha do núcleo relacional H1B); sem ela, esses mesmos testes
    # são pulados explicitamente (nunca fingem cobertura que não existe). O usuário `postgres` do serviço
    # tem privilégio de CREATEDB, necessário porque tests/h1b-core-relational.test.js cria bancos
    # isolados próprios (CREATE DATABASE/DROP DATABASE) para nunca colidir com os outros arquivos de
    # teste rodando em paralelo no mesmo Postgres de CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: patrono_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/patrono_ci_test
      # H2 (docs/DECISIONS.md, PROD-H2-01): chave de CI apenas, nunca usada em produção — necessária
      # para que o backfill de MFA de desenvolvimento/teste (seedAuthFields()/backfillDevAuthFields())
      # exercite o caminho real de cifragem em vez de degradar silenciosamente para "sem MFA".
      MFA_ENCRYPTION_KEY: ci-only-mfa-encryption-key-not-a-real-secret-32chars
      # Necessária para os testes de /api/backup (COEVO_BACKUP_KEY deve ter ao menos 32 caracteres).
      COEVO_BACKUP_KEY: ci-only-backup-key-not-a-real-secret-32-characters
      # H3 (docs/DECISIONS.md, PROD-H3-01): chave de CI apenas, nunca usada em produção — necessária
      # para derivar as chaves de bucket de rate limiting (HMAC-SHA256). Sem ela, os testes ainda
      # rodariam (fallback de desenvolvimento fora de produção), mas de forma menos representativa do
      # caminho real de produção — mesma disciplina já aplicada a MFA_ENCRYPTION_KEY/COEVO_BACKUP_KEY.
      RATE_LIMIT_HMAC_KEY: ci-only-rate-limit-hmac-key-not-a-real-secret-32chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalação determinística das dependências
        run: npm ci

      # Hardening H5 (docs/PRODUCTION_GATE.md, PG-21; docs/DECISIONS.md, PROD-H5-01):
      # tests/h5-backup-restore-postgres.test.js chama pg_dump/pg_restore REAIS (nunca mock). Runners
      # ubuntu-latest normalmente já trazem postgresql-client, mas a versão pode divergir da imagem
      # postgres:16 do serviço acima — instala explicitamente o client 16 para nunca depender de
      # coincidência entre o que o runner já tem e a versão real do serviço, evitando um falso backup
      # "válido" produzido por uma ferramenta de versão incompatível (item 6 do escopo H5).
      - name: Instalar postgresql-client 16 (pg_dump/pg_restore para os testes reais de backup/restore H5)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: npm test (unitários + integração HTTP real, incluindo backend PostgreSQL real)
        run: npm test

      - name: npm audit (relatório informativo, não bloqueia o merge)
        # Duas vulnerabilidades altas conhecidas em pptxgenjs/image-size (docs/SECURITY.md) — o upgrade
        # disponível é major e precisa de validação própria da exportação PPTX/PDF antes de ser aplicado.
        # Mantido como relatório visível no CI, não como gate, para não travar todo PR por essa pendência
        # já registrada e rastreada separadamente.
        run: npm audit --audit-level=high || true
